<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- V1.0 display: one edge-to-edge page for every browser (phones, tablets, desktops): the game fills the whole
         browser viewport; viewport-fit=cover lets it run under notches (the game keeps its HUD inside the safe area). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- Shown by wallet apps (Phantom / Solflare read app_url = this page) when the player approves a connection. -->
    <title>Battle of Shinkai</title>
    <meta name="description" content="Battle of Shinkai: an AxoRonin samurai battle game. Connecting a wallet is optional and read-only.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Installable as a full-screen, landscape web app ("Add to Home Screen" / "Install app"). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b0a18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shinkai">
    <link rel="apple-touch-icon" href="TemplateData/icon-192.png">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <!-- Start / loading screen. Touch devices: "TAP TO PLAY" (full screen and landscape need a tap), then the loading
         progress until the game is ready. Mouse devices: the loading progress only. -->
    <div id="shinkai-start" class="shinkai-overlay">
      <div class="shinkai-title">BATTLE OF SHINKAI</div>
      <button id="shinkai-start-button" class="shinkai-start-button" type="button">TAP TO PLAY</button>
      <div class="shinkai-progress"><div id="shinkai-progress-fill"></div></div>
      <div id="shinkai-start-hint" class="shinkai-hint">Loading…</div>
      <button id="shinkai-install" class="shinkai-pill" type="button">INSTALL THE APP (FULL SCREEN)</button>
    </div>
    <!-- Phones in portrait where landscape cannot be locked: a friendly prompt (the player may also continue). -->
    <div id="shinkai-rotate" class="shinkai-overlay">
      <div class="shinkai-phone"></div>
      <div class="shinkai-title">ROTATE YOUR PHONE</div>
      <div class="shinkai-hint">Battle of Shinkai plays best in landscape.</div>
      <button id="shinkai-portrait" class="shinkai-pill" type="button">PLAY IN PORTRAIT</button>
    </div>
    <!-- No WebGL 2 / WebAssembly: a clear message instead of a broken game. -->
    <div id="shinkai-unsupported" class="shinkai-overlay">
      <div class="shinkai-title">BATTLE OF SHINKAI</div>
      <div id="shinkai-unsupported-text" class="shinkai-hint shinkai-message"></div>
    </div>
    <button id="shinkai-fullscreen" type="button" aria-label="Full screen">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>FULL SCREEN</span>
    </button>
    <!-- Reads the CSS safe-area insets (notch, rounded corners, home indicator) for the game's HUD. -->
    <div id="shinkai-safe-probe" aria-hidden="true"></div>

    <!-- Phase 14 follow-up: phones connect Phantom / Solflare through the wallet APP and come back to this page; runs
         before the game so a wallet's answer is read (and removed from the address bar) right away. -->
    <script src="TemplateData/shinkai-wallet-link.js"></script>
    <script>
      let canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or a permanent error message if type=='error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.textContent = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: #fff; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #ffd54a; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL-MPTest.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL-MPTest.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL-MPTest.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL-MPTest.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "DefaultCompany",
        productName: "battleofshinkai",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // ---------------------------------------------------------------- Battle of Shinkai: display (V1.0)
      // Every browser gets the same edge-to-edge page; behaviour follows what the browser CAN do (feature detection),
      // not its name:
      //   - the canvas always fills the browser viewport (CSS: fixed, inset 0) and follows toolbars appearing /
      //     disappearing, rotation, window resizes and full screen; Unity matches its drawing size to the canvas;
      //   - full screen through the Fullscreen API (standard or webkit-prefixed) from a tap / click — TAP TO PLAY on
      //     touch devices, the FULL SCREEN button everywhere it is allowed; then landscape is locked where the
      //     browser supports it (Android Chrome / Samsung Internet / Firefox Android in full screen);
      //   - where full screen is not available (iPhone Safari, many in-app browsers) the page still fills the visible
      //     area and points to "Add to Home Screen" / "Open in browser"; the installed app runs full screen in
      //     landscape (manifest.webmanifest); browsers that offer an install prompt get an INSTALL button;
      //   - phones in portrait where landscape cannot be locked see a friendly prompt (PLAY IN PORTRAIT continues);
      //   - the CSS safe-area insets are published for the game (window.ShinkaiDisplay → ShinkaiDisplay.jslib) so its
      //     HUD, joystick and buttons stay clear of notches and the home indicator;
      //   - no WebGL 2 or WebAssembly → a clear message instead of a broken game (nothing is downloaded).
      // Browser navigation bars cannot be hidden by a web page; full screen / the installed app are the supported ways.
      var root = document.documentElement;
      var ua = navigator.userAgent || "";
      var coarsePointer = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      var touchDevice = coarsePointer || (navigator.maxTouchPoints > 1 && /Mobi|Android|iPhone|iPad|iPod/i.test(ua));
      var shortSide = Math.min(screen.width || 0, screen.height || 0);
      var phone = touchDevice && shortSide > 0 && shortSide < 600;
      var iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
      var standaloneQuery = window.matchMedia ? window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)") : null;
      function isStandalone() { return (standaloneQuery && standaloneQuery.matches) || navigator.standalone === true; }
      var requestFullscreenFn = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
      // Allowed: a request function exists and the page may use it (an embedding frame or browser policy can say no).
      var fullscreenFlags = [document.fullscreenEnabled, document.webkitFullscreenEnabled, document.mozFullScreenEnabled, document.msFullscreenEnabled];
      var fullscreenFlagKnown = fullscreenFlags.some(function(f) { return typeof f === "boolean"; });
      var canFullscreen = !!requestFullscreenFn && (!fullscreenFlagKnown || fullscreenFlags.some(function(f) { return f === true; }));
      var canLock = !!(screen.orientation && screen.orientation.lock);

      var startOverlay = document.querySelector("#shinkai-start");
      var startButton = document.querySelector("#shinkai-start-button");
      var startHint = document.querySelector("#shinkai-start-hint");
      var installButton = document.querySelector("#shinkai-install");
      var rotateOverlay = document.querySelector("#shinkai-rotate");
      var portraitButton = document.querySelector("#shinkai-portrait");
      var fullscreenButton = document.querySelector("#shinkai-fullscreen");
      var progressFill = document.querySelector("#shinkai-progress-fill");
      var probe = document.querySelector("#shinkai-safe-probe");
      var started = !touchDevice || isStandalone(); // a mouse device (or the installed app) needs no tap first
      var loaded = false;
      var failed = false;
      var portraitAllowed = false;
      try { portraitAllowed = sessionStorage.getItem("shinkai.portrait") === "1"; } catch (e) { }
      var installPrompt = null;
      var buttonShownAt = 0;

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      }

      function enterFullscreen() {
        if (!canFullscreen || isFullscreen()) return;
        var request = null;
        try { request = requestFullscreenFn.call(root, { navigationUI: "hide" }); } catch (e) { request = null; }
        var lockLandscape = function() {
          if (touchDevice && canLock) { try { screen.orientation.lock("landscape").catch(function() {}); } catch (e) { } }
        };
        if (request && request.then) request.then(lockLandscape).catch(function() { updateOverlays(); }); else setTimeout(lockLandscape, 150);
      }

      // The CSS safe-area insets as fractions of the game canvas (left, top, right, bottom). 0 where there are none.
      var safeInsets = { left: 0, top: 0, right: 0, bottom: 0 };
      function measureSafeArea() {
        var style = window.getComputedStyle(probe);
        var w = canvas.clientWidth || window.innerWidth || 1, h = canvas.clientHeight || window.innerHeight || 1;
        var px = function(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
        safeInsets = {
          left: Math.min(0.25, px(style.paddingLeft) / w), top: Math.min(0.25, px(style.paddingTop) / h),
          right: Math.min(0.25, px(style.paddingRight) / w), bottom: Math.min(0.25, px(style.paddingBottom) / h)
        };
      }
      window.ShinkaiDisplay = {
        safeInsets: function() { return safeInsets; },
        isFullscreen: isFullscreen,
        enterFullscreen: enterFullscreen
      };

      function showFullscreenButton(expanded) {
        fullscreenButton.classList.toggle("compact", !expanded);
        if (expanded) buttonShownAt = Date.now();
      }

      function updateStartScreen() {
        var waiting = !started || !loaded || failed;
        startOverlay.classList.toggle("visible", waiting);
        startButton.style.display = started ? "none" : "";
        if (failed) return;
        if (!started) {
          startHint.textContent = !canFullscreen && iOS ? "Full screen on iPhone / iPad: Share → Add to Home Screen."
            : !canFullscreen ? "Tip: open this page in your browser (not inside another app) for full screen."
            : "Plays full screen" + (phone ? " in landscape." : ".");
        } else if (!loaded) startHint.textContent = "Loading…";
        installButton.style.display = installPrompt && !isStandalone() ? "" : "none";
      }

      function updateOverlays() {
        var portrait = window.innerHeight > window.innerWidth;
        // Before the first tap where the tap itself turns the game to landscape, the start screen stays up.
        var tapWillRotate = !started && canFullscreen && canLock;
        var landscapeLocked = isFullscreen() && canLock;
        rotateOverlay.classList.toggle("visible", phone && portrait && !tapWillRotate && !landscapeLocked && !portraitAllowed && !failed);
        var showButton = canFullscreen && started && !isStandalone() && !isFullscreen() && !failed;
        if (showButton && fullscreenButton.style.display !== "flex") showFullscreenButton(true);
        fullscreenButton.style.display = showButton ? "flex" : "none";
        measureSafeArea();
      }

      function fail(text) {
        failed = true;
        document.querySelector("#shinkai-unsupported-text").textContent = text;
        document.querySelector("#shinkai-unsupported").classList.add("visible");
        startOverlay.classList.remove("visible");
        rotateOverlay.classList.remove("visible");
        fullscreenButton.style.display = "none";
      }

      // What the game needs: WebGL 2 (3D graphics) and WebAssembly. Checked before anything is downloaded.
      function compatibilityProblem() {
        if (typeof WebAssembly !== "object" || typeof WebAssembly.instantiate !== "function")
          return "This browser cannot run Battle of Shinkai: it does not support WebAssembly.";
        var gl = null;
        try { gl = document.createElement("canvas").getContext("webgl2"); } catch (e) { gl = null; }
        if (!gl) return "This browser or device cannot run Battle of Shinkai: 3D graphics (WebGL 2) are not available. " +
          "Try the latest Chrome, Safari, Edge, Firefox, Samsung Internet or Opera, and make sure hardware acceleration is on.";
        var lose = gl.getExtension("WEBGL_lose_context");
        if (lose) lose.loseContext();
        return null;
      }

      document.body.classList.add(touchDevice ? "shinkai-touch" : "shinkai-mouse");
      // Rendering cost: at most 1.5 device pixels per CSS pixel on touch devices and 1.25 on desktops, and at most about
      // 2.4 (touch) / 3.7 (desktop) megapixels on the largest screens — the game draws only what the screen shows.
      var dpr = window.devicePixelRatio || 1;
      var screenPixels = Math.max(1, (screen.width || 1280) * (screen.height || 720));
      config.devicePixelRatio = Math.max(1, Math.min(dpr, touchDevice ? 1.5 : 1.25, Math.sqrt((touchDevice ? 2.4e6 : 3.7e6) / screenPixels)));

      startButton.addEventListener("click", function() {
        started = true;
        enterFullscreen();
        updateStartScreen();
        updateOverlays();
      });
      fullscreenButton.addEventListener("click", enterFullscreen);
      portraitButton.addEventListener("click", function() {
        portraitAllowed = true;
        try { sessionStorage.setItem("shinkai.portrait", "1"); } catch (e) { }
        updateOverlays();
      });
      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        installPrompt = e;
        updateStartScreen();
      });
      installButton.addEventListener("click", function() {
        if (!installPrompt) return;
        installPrompt.prompt();
        installPrompt = null;
        updateStartScreen();
      });
      // Viewport changes: rotation, window resizes, browser toolbars, full screen, the installed app.
      var onViewportChange = function() { updateOverlays(); setTimeout(updateOverlays, 350); };
      window.addEventListener("resize", onViewportChange);
      window.addEventListener("orientationchange", onViewportChange);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", onViewportChange);
      ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"].forEach(function(name) {
        document.addEventListener(name, onViewportChange);
      });
      if (standaloneQuery && standaloneQuery.addEventListener) standaloneQuery.addEventListener("change", onViewportChange);
      // Insets can change without a resize event (e.g. a browser's own bars on some phones): measured again each second.
      setInterval(measureSafeArea, 1000);
      // The full-screen button shrinks to a small icon after a few seconds; the mouse near the top edge expands it.
      setInterval(function() {
        if (fullscreenButton.style.display === "flex" && !fullscreenButton.classList.contains("compact") && Date.now() - buttonShownAt > 6000) showFullscreenButton(false);
      }, 1000);
      document.addEventListener("mousemove", function(e) {
        if (e.clientY < 70 && fullscreenButton.style.display === "flex" && fullscreenButton.classList.contains("compact")) showFullscreenButton(true);
      });
      // Nothing scrolls or zooms around the game (pinch / double-tap zoom, rubber-band scrolling).
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); });
      document.addEventListener("touchmove", function(e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progressFill) progressFill.style.width = 100 * progress + "%";
          if (progress >= 1) {
            loaded = true;
            updateStartScreen();
            updateOverlays();
          }
        }).then((unityInstance) => {
          loaded = true;
          updateStartScreen();
          updateOverlays();
        }).catch((message) => {
          fail("The game could not start in this browser: " + message + " Reload the page to try again.");
        });
      };

      var problem = compatibilityProblem();
      updateStartScreen();
      updateOverlays();
      if (problem) {
        fail(problem); // nothing is downloaded
      } else if (window.ShinkaiWalletLink && window.ShinkaiWalletLink.isGameHeld()) {
        // Phase 15: the tab between the two wallet-app trips (connect → sign in) never needs the game, so it is not loaded.
        window.ShinkaiWalletLink.whenGameAllowed(function () { document.body.appendChild(script); });
      } else {
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
