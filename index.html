<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Shown by wallet apps (Phantom / Solflare read app_url = this page) when the player approves a connection. -->
    <title>Battle of Shinkai</title>
    <meta name="description" content="Battle of Shinkai: an AxoRonin samurai battle game. Connecting a wallet is optional and read-only.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Battle of Shinkai: installable as a full-screen, landscape web app ("Add to Home Screen"). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b0a18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shinkai">
    <link rel="apple-touch-icon" href="TemplateData/icon-192.png">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">battleofshinkai</div>
      </div>
    </div>

    <!-- Phones only (shown by the script below). -->
    <div id="shinkai-start" class="shinkai-overlay">
      <div class="shinkai-title">BATTLE OF SHINKAI</div>
      <button id="shinkai-start-button" class="shinkai-start-button" type="button">TAP TO PLAY</button>
      <div class="shinkai-progress"><div id="shinkai-progress-fill"></div></div>
      <div id="shinkai-start-hint" class="shinkai-hint">Plays full screen in landscape.</div>
    </div>
    <div id="shinkai-rotate" class="shinkai-overlay">
      <div class="shinkai-phone"></div>
      <div class="shinkai-title">ROTATE YOUR PHONE</div>
      <div class="shinkai-hint">Battle of Shinkai plays in landscape.</div>
    </div>
    <button id="shinkai-fullscreen" type="button">&#x26F6; FULL SCREEN</button>

    <!-- Phase 14 follow-up: phones connect Phantom / Solflare through the wallet APP and come back to this page; runs
         before the game so a wallet's answer is read (and removed from the address bar) right away. -->
    <script src="TemplateData/shinkai-wallet-link.js"></script>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL-GitHubPages.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL-GitHubPages.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL-GitHubPages.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL-GitHubPages.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "DefaultCompany",
        productName: "battleofshinkai",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // ---------------------------------------------------------------- Battle of Shinkai: phones
      // Browsers only allow full screen and orientation lock from a user tap, so phones get a "TAP TO PLAY" screen
      // while the game loads behind it; the tap enters full screen and locks landscape where supported (Android
      // Chrome). iPhone Safari supports neither for web pages: a "rotate your phone" screen covers portrait instead,
      // and "Add to Home Screen" (manifest.webmanifest) runs it full screen in landscape.
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var startOverlay = document.querySelector("#shinkai-start");
      var rotateOverlay = document.querySelector("#shinkai-rotate");
      var fullscreenButton = document.querySelector("#shinkai-fullscreen");
      var progressFill = document.querySelector("#shinkai-progress-fill");
      var standalone = window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone === true;
      var root = document.documentElement;
      var canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen);
      var canLock = !!(screen.orientation && screen.orientation.lock);
      var started = false;

      function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

      function enterFullscreenLandscape() {
        var request = root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" })
                    : root.webkitRequestFullscreen ? root.webkitRequestFullscreen() : null;
        var lockLandscape = function() {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function() {});
        };
        if (request && request.then) request.then(lockLandscape).catch(function() {}); else lockLandscape();
      }

      function updateOverlays() {
        if (!isMobile) return;
        var portrait = window.innerHeight > window.innerWidth;
        // Before the first tap on Android the tap itself turns the game to landscape, so the start screen stays up.
        var tapWillRotate = !started && canFullscreen && canLock;
        rotateOverlay.classList.toggle("visible", portrait && !tapWillRotate);
        fullscreenButton.style.display = started && canFullscreen && !standalone && !isFullscreen() && !portrait ? "block" : "none";
      }

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Phone GPU cost: render at most 1.5x device pixels (2-3x phones would otherwise draw 4-9x the pixels).
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

        if (standalone) {
          started = true; // launched from the home screen: already full screen, orientation from the manifest
        } else {
          if (!canFullscreen) document.querySelector("#shinkai-start-hint").textContent =
            "Tip: Share → Add to Home Screen plays full screen.";
          startOverlay.classList.add("visible");
          document.querySelector("#shinkai-start-button").addEventListener("click", function() {
            started = true;
            startOverlay.classList.remove("visible");
            if (canFullscreen) enterFullscreenLandscape();
            updateOverlays();
          });
        }
        fullscreenButton.addEventListener("click", enterFullscreenLandscape);
        window.addEventListener("resize", updateOverlays);
        window.addEventListener("orientationchange", updateOverlays);
        document.addEventListener("fullscreenchange", updateOverlays);
        document.addEventListener("webkitfullscreenchange", updateOverlays);
        updateOverlays();


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progressFill) progressFill.style.width = 100 * progress + "%";
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
